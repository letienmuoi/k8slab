apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-routing
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "4.2"
  annotations:
    lab.muoilt.vn/purpose: "Route frontend and normalization API by HTTP path"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pipeline-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipeline-frontend
                port:
                  number: 8080
