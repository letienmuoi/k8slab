apiVersion: apps/v1
kind: Deployment
metadata:
  name: qnet-catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: qnet-capstone
    app.kubernetes.io/part-of: qnet-data-quality
    app.kubernetes.io/component: storage
    app.kubernetes.io/version: "1.0.0"
    tier: data
    track: stable
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: qnet-capstone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/instance: qnet-capstone
        app.kubernetes.io/part-of: qnet-data-quality
        app.kubernetes.io/component: storage
        app.kubernetes.io/version: "1.0.0"
        tier: data
        track: stable
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          image: mualanhlung017/qnet-catalog:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_PATH
              value: /data/catalog.db
            - name: CATALOG_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qnet-secrets
                  key: catalog-api-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          volumeMounts:
            - name: catalog-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: catalog-data
          persistentVolumeClaim:
            claimName: qnet-catalog-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qnet-catalog
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: qnet-capstone
    app.kubernetes.io/part-of: qnet-data-quality
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: qnet-capstone
  ports:
    - name: http
      port: 8080
      targetPort: http
