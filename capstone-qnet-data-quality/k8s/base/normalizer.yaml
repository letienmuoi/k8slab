apiVersion: v1
kind: Service
metadata:
  name: qnet-normalizer
  labels:
    app.kubernetes.io/name: normalizer
    app.kubernetes.io/instance: qnet-capstone
    app.kubernetes.io/part-of: qnet-data-quality
    active-track: blue
