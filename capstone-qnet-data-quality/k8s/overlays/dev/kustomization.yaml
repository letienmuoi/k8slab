apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qnet-capstone
resources:
  - ../../base
  - ../../security
  - ../../storage
  - ../../network
images:
  - name: mualanhlung017/qnet-gateway
    newTag: 1.0.0
  - name: mualanhlung017/qnet-ingest
    newTag: 1.0.0
  - name: mualanhlung017/qnet-quality
    newTag: 1.0.0
  - name: mualanhlung017/qnet-catalog
    newTag: 1.0.0
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
