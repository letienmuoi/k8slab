apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qnet-workers-dns-only-egress
  labels:
    app.kubernetes.io/part-of: qnet-data-quality
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qnet-catalog-no-egress
  labels:
    app.kubernetes.io/part-of: qnet-data-quality
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog
      app.kubernetes.io/instance: qnet-capstone
  policyTypes:
    - Egress
  egress: []
