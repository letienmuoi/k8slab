apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qnet-default-deny-ingress
  labels:
    app.kubernetes.io/part-of: qnet-data-quality
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: qnet-data-quality
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qnet-allow-gateway-ingress
  labels:
    app.kubernetes.io/part-of: qnet-data-quality
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/instance: qnet-capstone
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              role: access-client
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
