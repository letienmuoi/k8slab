apiVersion: batch/v1
kind: CronJob
metadata:
  name: qnet-cluster-audit
  labels:
    app.kubernetes.io/name: observer
    app.kubernetes.io/instance: qnet-capstone
    app.kubernetes.io/part-of: qnet-data-quality
    app.kubernetes.io/component: operations
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: observer
        app.kubernetes.io/instance: qnet-capstone
        app.kubernetes.io/part-of: qnet-data-quality
        app.kubernetes.io/component: operations
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: observer
            app.kubernetes.io/instance: qnet-capstone
            app.kubernetes.io/part-of: qnet-data-quality
            app.kubernetes.io/component: operations
            role: observer
        spec:
          serviceAccountName: qnet-observer
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: mualanhlung017/qnet-gateway:1.0.0
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/cluster_audit.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 8Mi
