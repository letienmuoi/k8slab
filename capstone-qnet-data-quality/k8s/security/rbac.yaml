apiVersion: v1
kind: ServiceAccount
metadata:
  name: qnet-observer
  labels:
    app.kubernetes.io/name: observer
    app.kubernetes.io/instance: qnet-capstone
    app.kubernetes.io/part-of: qnet-data-quality
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qnet-pod-reader
  labels:
    app.kubernetes.io/part-of: qnet-data-quality
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qnet-observer-reads-pods
  labels:
    app.kubernetes.io/part-of: qnet-data-quality
subjects:
  - kind: ServiceAccount
    name: qnet-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qnet-pod-reader
