{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "qnet-quality.fullname" . }}
  labels:
    {{- include "qnet-quality.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "qnet-quality.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - podSelector:
            matchLabels:
              role: access-client
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
