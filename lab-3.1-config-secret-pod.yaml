apiVersion: v1
kind: Pod
metadata:
  name: pipeline-config-auditor
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "3.1"
    component: config-auditor
  annotations:
    lab.muoilt.vn/purpose: "Audit pipeline dependencies using injected configuration"
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 5
  containers:
    - name: auditor
      image: mualanhlung017/ai-data-pipeline:1.0.2
      imagePullPolicy: IfNotPresent
      command:
        - /usr/bin/bash
        - -ec
      args:
        - |
          token_sha="$(printf '%s' "${CATALOG_CLIENT_TOKEN}" | /usr/bin/sha256sum | /usr/bin/cut -d ' ' -f 1)"
          echo "event=config_loaded pod=${HOSTNAME} token_sha256=${token_sha}"
          while true; do
            flink_url="$(cat /etc/pipeline/endpoints/flink.jobs.url)"
            iceberg_url="$(cat /etc/pipeline/endpoints/iceberg.tables.url)"
            minio_url="$(cat /etc/pipeline/endpoints/minio.ready.url)"
            flink_jobs="$(/usr/bin/curl -fsS "${flink_url}")"
            iceberg_tables="$(/usr/bin/curl -fsS -H "Authorization: Bearer ${CATALOG_CLIENT_TOKEN}" "${iceberg_url}")"
            minio_http="$(/usr/bin/curl -fsS -o /dev/null -w '%{http_code}' "${minio_url}")"
            echo "event=config_audit pod=${HOSTNAME} token_sha256=${token_sha} minio_http=${minio_http}"
            echo "flink_jobs=${flink_jobs}"
            echo "iceberg_tables=${iceberg_tables}"
            /usr/bin/sleep 30
          done
      env:
        - name: CATALOG_CLIENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: pipeline-catalog-secret
              key: catalog-client.token
      volumeMounts:
        - name: endpoints
          mountPath: /etc/pipeline/endpoints
          readOnly: true
      readinessProbe:
        exec:
          command:
            - /usr/bin/bash
            - -ec
            - |
              test -n "${CATALOG_CLIENT_TOKEN}"
              test -s /etc/pipeline/endpoints/flink.jobs.url
              test -s /etc/pipeline/endpoints/iceberg.tables.url
              test -s /etc/pipeline/endpoints/minio.ready.url
              /usr/bin/curl -fsS "$(cat /etc/pipeline/endpoints/flink.jobs.url)" >/dev/null
              /usr/bin/curl -fsS -H "Authorization: Bearer ${CATALOG_CLIENT_TOKEN}" "$(cat /etc/pipeline/endpoints/iceberg.tables.url)" >/dev/null
              /usr/bin/curl -fsS "$(cat /etc/pipeline/endpoints/minio.ready.url)" >/dev/null
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  volumes:
    - name: endpoints
      configMap:
        name: pipeline-endpoints
