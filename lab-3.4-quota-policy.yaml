apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-container-defaults
  namespace: pipeline-quota-lab
  labels:
    app: ai-data-pipeline
    lab: "3.4"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: 300m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pipeline-compute-quota
  namespace: pipeline-quota-lab
  labels:
    app: ai-data-pipeline
    lab: "3.4"
spec:
  hard:
    pods: "2"
    requests.cpu: 150m
    requests.memory: 192Mi
    limits.cpu: 300m
    limits.memory: 384Mi
