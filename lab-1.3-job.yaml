apiVersion: batch/v1
kind: Job
metadata:
  name: ai-data-pipeline-once
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "1.3"
    workload: one-off
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: ai-data-pipeline
        lab: "1.3"
        workload: one-off
    spec:
      restartPolicy: Never
      containers:
        - name: pipeline
          image: mualanhlung017/ai-data-pipeline:1.0.2
          imagePullPolicy: IfNotPresent
          command:
            - /opt/flink/bin/sql-client.sh
          args:
            - embedded
            - -Dexecution.target=local
            - --file
            - /opt/lab-sql/one-off.sql
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: pipeline-sql
              mountPath: /opt/lab-sql
              readOnly: true
      volumes:
        - name: pipeline-sql
          configMap:
            name: ai-data-pipeline-lab-sql
