apiVersion: v1
kind: Service
metadata:
  name: pipeline-release-gateway
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "2.2"
    component: release-gateway
  annotations:
    lab.muoilt.vn/purpose: "Single traffic entrypoint for blue/green releases"
spec:
  type: ClusterIP
  selector:
    app: ai-data-pipeline
    lab: "2.2"
    component: release-gateway
    track: blue
  ports:
    - name: http
      port: 8080
      targetPort: http
