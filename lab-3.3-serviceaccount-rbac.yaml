apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-observer
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "3.3"
    component: rbac-observer
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-pod-reader
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "3.3"
    component: rbac-observer
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-observer-reads-pods
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "3.3"
    component: rbac-observer
subjects:
  - kind: ServiceAccount
    name: pipeline-observer
    namespace: data-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-pod-reader
