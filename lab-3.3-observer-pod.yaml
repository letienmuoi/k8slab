apiVersion: v1
kind: Pod
metadata:
  name: pipeline-rbac-observer
  namespace: data-platform
  labels:
    app: ai-data-pipeline
    lab: "3.3"
    component: rbac-observer
  annotations:
    lab.muoilt.vn/purpose: "List data-platform Pods through the Kubernetes API using least-privilege RBAC"
spec:
  serviceAccountName: pipeline-observer
  automountServiceAccountToken: true
  restartPolicy: Always
  terminationGracePeriodSeconds: 5
  containers:
    - name: observer
      image: mualanhlung017/ai-data-pipeline:1.0.2
      imagePullPolicy: IfNotPresent
      command:
        - /usr/bin/bash
        - -ec
      args:
        - |
          token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
          ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          namespace_file=/var/run/secrets/kubernetes.io/serviceaccount/namespace
          api_server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
          while true; do
            namespace="$(cat "${namespace_file}")"
            http_code="$(/usr/bin/curl -sS --cacert "${ca_file}" \
              -H "Authorization: Bearer $(cat "${token_file}")" \
              -o /tmp/pods.json \
              -w '%{http_code}' \
              "${api_server}/api/v1/namespaces/${namespace}/pods?pretty=false&labelSelector=app%3Dai-data-pipeline")"
            test "${http_code}" = "200"
            pod_count="$(/usr/bin/grep -o '"metadata":{"name":"[^"]*"' /tmp/pods.json | /usr/bin/wc -l | /usr/bin/tr -d ' ')"
            pod_names="$(/usr/bin/grep -o '"metadata":{"name":"[^"]*"' /tmp/pods.json | /usr/bin/sed 's/.*"name":"//;s/"$//' | /usr/bin/tr '\n' ',' | /usr/bin/sed 's/,$//')"
            response_bytes="$(/usr/bin/wc -c < /tmp/pods.json | /usr/bin/tr -d ' ')"
            echo "event=rbac_api_list namespace=${namespace} http=${http_code} pod_count=${pod_count} response_bytes=${response_bytes}"
            echo "pod_names=${pod_names}"
            /usr/bin/sleep 30
          done
      readinessProbe:
        exec:
          command:
            - /usr/bin/bash
            - -ec
            - |
              token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
              ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              test -s "${token_file}"
              /usr/bin/curl -fsS --cacert "${ca_file}" \
                -H "Authorization: Bearer $(cat "${token_file}")" \
                "https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}/api/v1/namespaces/${namespace}/pods?limit=1" \
                >/dev/null
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
